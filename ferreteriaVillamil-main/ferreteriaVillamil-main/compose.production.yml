services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ferreteria
      POSTGRES_DB: ferreteria
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ferreteria -d ferreteria]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ferreteria:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/ferreteria
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY:?Set SUPABASE_KEY}
      TRUST_PROXY: '1'
    command: [sh, -c, npm run db:migrate && exec node bin/www]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
