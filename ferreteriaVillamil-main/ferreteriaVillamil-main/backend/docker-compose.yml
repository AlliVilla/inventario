services:
  postgres:
    image: postgres:17
    container_name: ferreteria_villamil_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ferreteria_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferreteria_development"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


